<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>BC Gradebook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-mark">BC</span>
        <span class="brand-name">Gradebook</span>
      </div>
      <button id="add-class-btn" class="btn btn-primary btn-block">+ Add Class</button>
      <div class="class-list-label">Classes</div>
      <nav id="class-list" class="class-list"></nav>
      <div class="sidebar-footer">
        <button id="theme-btn" class="btn btn-ghost btn-sm btn-block">🌙 Dark mode</button>
        <button id="export-xlsx-btn" class="btn btn-ghost btn-sm btn-block">⬇ Export grades to Excel</button>
        <div class="footer-row">
          <button id="export-btn" class="btn btn-ghost btn-sm">Export backup</button>
          <button id="import-btn" class="btn btn-ghost btn-sm">Import backup</button>
        </div>
        <div id="save-status" class="save-status"></div>
      </div>
    </aside>

    <!-- Main -->
    <main id="main">
      <div id="main-empty" class="empty-state">
        <h1>Welcome to your gradebook</h1>
        <p>Create your first class to get started. A class is a group of
           students — then you add the subjects you teach that class. For a
           homeroom, add several subjects; for a single-subject block, just add
           one.</p>
        <button class="btn btn-primary" id="empty-add-class">+ Add your first class</button>
      </div>

      <div id="class-view" class="hidden">
        <header id="class-header">
          <div>
            <h1 id="class-title">Class</h1>
            <p id="class-subtitle" class="muted"></p>
          </div>
          <div class="header-actions">
            <button class="btn btn-ghost btn-sm" id="edit-class-btn">Edit class</button>
            <button class="btn btn-ghost btn-sm danger" id="delete-class-btn">Delete</button>
          </div>
        </header>

        <nav class="subject-nav" id="subject-nav"></nav>
        <nav class="tabs" id="sub-tabs"></nav>
        <section id="tab-content" class="tab-content"></section>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>

  <script src="calc.js"></script>
  <script src="bc-curriculum.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
